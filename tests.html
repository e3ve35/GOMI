<!DOCTYPE html>
<html>
  <head><meta charset="utf-8" /><title>GOMI tests</title>
    <style>
      body { font-family: monospace; background: #111; color: #eee; padding: 20px; }
      .pass { color: #6f6; } .fail { color: #f66; } pre { color: #aaa; margin: 4px 0 12px 20px; }
    </style>
  </head>
  <body>
    <h1>GOMI tests</h1>
    <div id="out"></div>
    <script type="module">
      import { toNyquist } from "./js/nyquist.js";
      import { scoreDurationSeconds, glideFor } from "./js/ui/Transport.js";
      import { Scale, SCALES, midiName } from "./js/score/Scale.js";
      import { computeLayout, SPACING } from "./js/config.js";
      import {
        Note, noteAt, maxLengthFor, minStartFor, remapRows, ghostLength,
        glidePair, clearGlidesTo,
      } from "./js/score/Note.js";
      import { headroomLevel, FULL_SCALE_PEAK, VOICE_LEVEL, CLEAN_VOICES } from "./js/audio/Voice.js";

      let passed = 0, failed = 0;
      const out = document.getElementById("out");
      function test(name, fn) {
        try { fn(); passed++; out.innerHTML += `<div class="pass">PASS ${name}</div>`; }
        catch (e) { failed++; out.innerHTML += `<div class="fail">FAIL ${name}</div><pre>${e.message}</pre>`; }
      }
      function close(actual, expected, tol = 1e-9) {
        if (Math.abs(actual - expected) > tol) {
          throw new Error(`expected ${expected} +/- ${tol}, got ${actual}`);
        }
      }

      function eq(actual, expected) {
        if (actual !== expected) {
          throw new Error(`expected: ${JSON.stringify(expected)}\nactual:   ${JSON.stringify(actual)}`);
        }
      }














      test("C major over 3 octaves is 22 rows", () => {
        eq(new Scale(48, "major", 3).rowCount, 22);
      });

      test("the bottom row is the root", () => {
        const s = new Scale(48, "major", 3);
        eq(s.midiForRow(s.rowCount - 1), 48);
      });

      test("the top row is the root three octaves up", () => {
        eq(new Scale(48, "major", 3).midiForRow(0), 84);
      });

      test("rows ascend by scale degree from the bottom", () => {
        const s = new Scale(48, "major", 3);
        eq(s.midiForRow(21), 48); // C3
        eq(s.midiForRow(20), 50); // D3
        eq(s.midiForRow(19), 52); // E3
        eq(s.midiForRow(18), 53); // F3
        eq(s.midiForRow(14), 60); // C4, one octave up
      });

      test("minor rows use the minor third", () => {
        const s = new Scale(48, "minor", 3);
        eq(s.midiForRow(19), 51); // Eb3, not E3
      });

      test("a pentatonic scale is 16 rows", () => {
        eq(new Scale(48, "major pentatonic", 3).rowCount, 16);
      });

      test("midiName fixes the two labels that were wrong", () => {
        eq(midiName(64), "E4");   // config.js called this e#4
        eq(midiName(73), "C#5");  // config.js called this d5
      });

      test("midiName handles octave boundaries", () => {
        eq(midiName(60), "C4");
        eq(midiName(59), "B3");
      });

      test("labelForRow names the row's pitch", () => {
        eq(new Scale(48, "major", 3).labelForRow(14), "C4");
      });

      test("every scale starts on the root", () => {
        Object.values(SCALES).forEach((intervals) => eq(intervals[0], 0));
      });


      test("a note covers every column from its start", () => {
        const n = new Note(0, 4, 3);
        eq(n.endCol, 7);
        eq(n.covers(3), false);
        eq(n.covers(4), true);
        eq(n.covers(6), true);
        eq(n.covers(7), false);
      });

      test("noteAt finds a note by any column it covers", () => {
        const notes = [new Note(2, 4, 3)];
        eq(noteAt(notes, 2, 5), notes[0]);
        eq(noteAt(notes, 2, 9), null);
        eq(noteAt(notes, 3, 5), null);
      });

      test("maxLengthFor runs to the grid edge with nothing in the way", () => {
        eq(maxLengthFor([], 0, 60, 68), 8);
      });

      test("maxLengthFor stops at the next note in the same row", () => {
        const notes = [new Note(0, 10, 1)];
        eq(maxLengthFor(notes, 0, 4, 68), 6);
      });

      test("maxLengthFor ignores notes in other rows", () => {
        const notes = [new Note(1, 6, 1)];
        eq(maxLengthFor(notes, 0, 4, 68), 64);
      });

      test("maxLengthFor ignores notes that start earlier", () => {
        const notes = [new Note(0, 1, 1)];
        eq(maxLengthFor(notes, 0, 4, 68), 64);
      });

      test("maxLengthFor picks the nearest of several later notes", () => {
        const notes = [new Note(0, 30, 1), new Note(0, 12, 1), new Note(0, 50, 1)];
        eq(maxLengthFor(notes, 0, 4, 68), 8);
      });

      test("remapRows clamps rows that no longer exist", () => {
        const notes = [new Note(21, 0, 1), new Note(3, 0, 1)];
        const out = remapRows(notes, 16);
        eq(out.length, 2);
        eq(out.filter((n) => n.row === 15).length, 1);
        eq(out.filter((n) => n.row === 3).length, 1);
      });

      test("remapRows drops duplicates created by clamping, keeping the longer", () => {
        const notes = [new Note(21, 0, 1), new Note(20, 0, 4)];
        const out = remapRows(notes, 16);
        eq(out.length, 1);
        eq(out[0].length, 4);
      });

      test("remapRows leaves an in-range score untouched", () => {
        const notes = [new Note(0, 0, 1), new Note(5, 3, 2)];
        eq(remapRows(notes, 22).length, 2);
      });


      test("toNyquist emits notes in ascending time order with real durations", () => {
        const scale = new Scale(48, "major", 3);
        const notes = [new Note(0, 2, 3, "triangle"), new Note(21, 0, 1, "sine")];
        eq(
          toNyquist(notes, scale, 0.5),
          "{\n {0.00 0.50 {sine-instr pitch: 48}} \n {1.00 1.50 {triangle-instr pitch: 84}} \n}"
        );
      });

      test("toNyquist handles an empty score", () => {
        eq(toNyquist([], new Scale(), 0.5), "{\n}");
      });

      test("scoreDurationSeconds spans to the end of the last note", () => {
        eq(scoreDurationSeconds([new Note(0, 4, 3), new Note(1, 0, 1)], 0.5), 3.5);
      });

      test("scoreDurationSeconds is not the note count", () => {
        const stacked = [0, 1, 2, 3, 4].map((r) => new Note(r, 0, 1));
        eq(scoreDurationSeconds(stacked, 0.5), 0.5);
      });

      test("scoreDurationSeconds of an empty score is zero", () => {
        eq(scoreDurationSeconds([], 0.5), 0);
      });


      test("headroomLevel keeps a full chord under the clipping ceiling", () => {
        close(headroomLevel(6, 0.9) * 6 * FULL_SCALE_PEAK, 0.9);
      });

      test("headroomLevel never amplifies past unity", () => {
        eq(headroomLevel(1, 0.9), 1);
      });

      test("the shipped voice level leaves CLEAN_VOICES notes unclipped", () => {
        if (VOICE_LEVEL * CLEAN_VOICES * FULL_SCALE_PEAK > 1) {
          throw new Error(
            `${CLEAN_VOICES} voices reach ` +
            `${(VOICE_LEVEL * CLEAN_VOICES * FULL_SCALE_PEAK).toFixed(3)} at master`
          );
        }
      });

      test("a single note is still clearly audible", () => {
        if (VOICE_LEVEL * FULL_SCALE_PEAK < 0.1) {
          throw new Error(`single note peaks at only ${(VOICE_LEVEL * FULL_SCALE_PEAK).toFixed(3)}`);
        }
      });


      test("glidePair orders the two notes earliest first", () => {
        const a = new Note(0, 8, 1), b = new Note(3, 2, 1);
        const pair = glidePair(a, b);
        eq(pair.first, b);
        eq(pair.second, a);
      });

      test("glidePair refuses two notes in the same row", () => {
        eq(glidePair(new Note(0, 0, 1), new Note(0, 4, 1)), null);
      });

      test("glidePair refuses a note joined to itself", () => {
        const a = new Note(0, 0, 1);
        eq(glidePair(a, a), null);
      });

      test("glidePair refuses notes that overlap in time", () => {
        eq(glidePair(new Note(0, 0, 5), new Note(3, 2, 1)), null);
      });

      test("glidePair allows a note starting exactly where the first ends", () => {
        const a = new Note(0, 0, 2), b = new Note(3, 2, 1);
        eq(glidePair(a, b).second, b);
      });

      test("glidePair refuses a missing partner", () => {
        eq(glidePair(new Note(0, 0, 1), null), null);
      });

      test("clearGlidesTo drops every link into the removed note", () => {
        const gone = new Note(0, 4, 1);
        const a = new Note(1, 0, 1), b = new Note(2, 0, 1), c = new Note(3, 0, 1);
        a.glideTo = gone;
        b.glideTo = gone;
        c.glideTo = a;
        clearGlidesTo([a, b, c], gone);
        eq(a.glideTo, null);
        eq(b.glideTo, null);
        eq(c.glideTo, a);
      });

      test("remapRows drops a glide to a note that clamping removed", () => {
        const a = new Note(0, 0, 1);
        const b = new Note(9, 4, 1);
        a.glideTo = b;
        const kept = remapRows([a, b, new Note(9, 4, 3)], 5);
        eq(kept.length, 2);
        eq(a.glideTo, null);
      });

      test("remapRows drops a glide that clamping folded onto one row", () => {
        const a = new Note(6, 0, 1);
        const b = new Note(9, 4, 1);
        a.glideTo = b;
        remapRows([a, b], 5);
        eq(a.glideTo, null);
      });

      test("remapRows keeps a glide that is still legal", () => {
        const a = new Note(0, 0, 1);
        const b = new Note(3, 4, 1);
        a.glideTo = b;
        remapRows([a, b], 5);
        eq(a.glideTo, b);
      });

      const stubScore = { freqForRow: (row) => row * 10 };

      test("glideFor is nothing for a note with no glide", () => {
        eq(glideFor(new Note(0, 0, 2), stubScore, 0.5), undefined);
      });

      test("glideFor holds, then bends, within the note's own length", () => {
        const a = new Note(0, 4, 3);
        a.glideTo = new Note(6, 20, 1);
        const glide = glideFor(a, stubScore, 0.5);
        close(glide.hold, 0.75);
        close(glide.seconds, 0.75);
        close(glide.hold + glide.seconds, 1.5); // the note's own length
        eq(glide.freq, 60);
      });

      test("glideFor is timed to the note, not the gap before its target", () => {
        const near = new Note(0, 0, 2), far = new Note(0, 0, 2);
        near.glideTo = new Note(6, 2, 1);
        far.glideTo = new Note(6, 40, 1);
        close(glideFor(near, stubScore, 0.5).seconds, glideFor(far, stubScore, 0.5).seconds);
      });

      test("minStartFor runs to the grid start with nothing in the way", () => {
        eq(minStartFor([], 0, 6), 0);
      });

      test("minStartFor stops at the end of the previous note in the row", () => {
        eq(minStartFor([new Note(0, 1, 2)], 0, 6), 3);
      });

      test("minStartFor ignores notes in other rows", () => {
        eq(minStartFor([new Note(5, 1, 2)], 0, 6), 0);
      });

      test("minStartFor ignores notes that start later", () => {
        eq(minStartFor([new Note(0, 8, 2)], 0, 6), 0);
      });

      test("minStartFor picks the nearest of several earlier notes", () => {
        eq(minStartFor([new Note(0, 0, 1), new Note(0, 3, 1)], 0, 6), 4);
      });

      test("ghostLength shows the full hint when nothing is in the way", () => {
        eq(ghostLength([], 0, 10, 68, 3), 3);
      });

      test("ghostLength is clipped by the grid edge", () => {
        eq(ghostLength([], 0, 66, 68, 3), 2);
      });

      test("ghostLength is clipped by the next note in the row", () => {
        eq(ghostLength([new Note(0, 12, 1)], 0, 10, 68, 3), 2);
      });

      test("ghostLength collapses to 1 when the next cell is taken", () => {
        eq(ghostLength([new Note(0, 11, 1)], 0, 10, 68, 3), 1);
      });

      test("ghostLength ignores notes in other rows", () => {
        eq(ghostLength([new Note(5, 11, 1)], 0, 10, 68, 3), 3);
      });


      const boxesOverlap = (a, b) =>
        a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;

      test("computeLayout keeps everything inside the viewport", () => {
        for (const [w, h] of [[1280, 720], [1440, 900], [1512, 860], [1920, 1080]]) {
          const L = computeLayout(w, h);
          for (const [name, box] of Object.entries({ grid: L.grid, amp: L.amp, env: L.env, fft: L.fft, buttons: L.buttons })) {
            if (box.x < 0 || box.y < 0 || box.x + box.w > L.w || box.y + box.h > L.h) {
              throw new Error(`${name} escapes the viewport at ${w}x${h}: ` + JSON.stringify(box));
            }
          }
        }
      });

      test("computeLayout never overlaps the grid with the panels", () => {
        for (const [w, h] of [[1280, 720], [1440, 900], [1512, 860]]) {
          const L = computeLayout(w, h);
          for (const [name, box] of Object.entries({ amp: L.amp, env: L.env, fft: L.fft, buttons: L.buttons })) {
            if (boxesOverlap(L.grid, box)) throw new Error(`${name} overlaps the grid at ${w}x${h}`);
          }
        }
      });

      test("the panels never overlap each other", () => {
        const L = computeLayout(1280, 720);
        const boxes = [["amp", L.amp], ["env", L.env], ["fft", L.fft], ["buttons", L.buttons]];
        for (let i = 0; i < boxes.length; i++) {
          for (let j = i + 1; j < boxes.length; j++) {
            if (boxesOverlap(boxes[i][1], boxes[j][1])) {
              throw new Error(`${boxes[i][0]} overlaps ${boxes[j][0]}`);
            }
          }
        }
      });

      test("the panels share one baseline", () => {
        const L = computeLayout(1512, 860);
        eq(L.amp.y, L.env.y);
        eq(L.fft.y, L.env.y);
        eq(L.amp.y + L.amp.h, L.env.y + L.env.h);
      });

      test("computeLayout clamps below the minimum window size", () => {
        const L = computeLayout(400, 300);
        eq(L.w, SPACING.minW);
        eq(L.h, SPACING.minH);
      });

      test("a taller window gives the grid more height", () => {
        const short = computeLayout(1440, 700);
        const tall = computeLayout(1440, 1000);
        if (tall.grid.h <= short.grid.h) throw new Error("grid did not grow with the window");
      });

      test("a wider window gives the grid more width", () => {
        const narrow = computeLayout(1280, 800);
        const wide = computeLayout(1920, 800);
        if (wide.grid.w <= narrow.grid.w) throw new Error("grid did not widen with the window");
      });

      test("the envelope panel keeps room for its slider column", () => {
        for (const w of [1200, 1280, 1440, 1920]) {
          const L = computeLayout(w, 800);
          if (L.env.labelX + 120 > L.env.x + L.env.w) {
            throw new Error(`envelope labels overflow its panel at width ${w}`);
          }
        }
      });

      out.innerHTML += `<h2 class="${failed ? "fail" : "pass"}">${passed} passed, ${failed} failed</h2>`;
    </script>
  </body>
</html>
